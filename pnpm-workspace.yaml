# Single-package repo — `packages:` is required (even though there's only
# one package) because pnpm 9.x (pinned in the Dockerfile's `base` stage
# via PNPM_VERSION) errors with "packages field missing or empty" during
# `pnpm install --frozen-lockfile` otherwise, even though this file exists
# only for `ignoredBuiltDependencies` below.
packages:
  - "."

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
