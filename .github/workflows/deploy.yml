name: Deploy

# Deploy pipeline — staging auto on merge, prod via GitHub Environment
# approval gate. See docs/ops/deploy.md for the runbook, rollback procedure,
# and the `--webpack` build-flag rationale (Sentry SDK on Next.js 16 — turbopack
# support not GA per mvp-launch-readiness.md §"Decisions").
#
# Build uses `next build --webpack` via the Dockerfile (matches `package.json`
# `build` script). Image registry: GHCR at ghcr.io/ramoneees/precisase.
# Deploy mechanism: SSH + `docker compose pull && up -d` via appleboy/ssh-action
# (simpler than Watchtower, no self-hosted runner per plan §Decisions).
#
# Two jobs:
#   1. deploy-staging — on push to main, deploys to staging.${APP_DOMAIN}.
#   2. deploy-prod     — on workflow_dispatch, gated by the `production`
#                        GitHub Environment (Settings → Environments →
#                        production → Required reviewers).
#
# Secrets required (GitHub Secrets):
#   - SSH_HOST, SSH_USERNAME, SSH_KEY         (appleboy/ssh-action)
#   - GITHUB_TOKEN                             (auto-provided, used for GHCR
#                                               login — no manual secret
#                                               needed for the registry)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to latest main)"
        required: false
        type: string

# Both jobs need packages: write to push to GHCR.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ramoneees/precisase

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    # A wedged SSH deploy shouldn't hold a runner for the full 360m
    # default — cap at 15 min so a stuck deploy surfaces as a failure
    # rather than burning Actions minutes.
    timeout-minutes: 15
    # Two merges to main shouldn't race — queue, don't cancel mid-deploy.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/precisase
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d web worker
            # `-T` disables TTY allocation which breaks CI SSH.
            docker compose -f docker-compose.yml -f docker-compose.staging.yml exec -T web pnpm exec prisma migrate deploy

      - name: Health check
        env:
          # Operator: replace with the real staging hostname (or set
          # APP_DOMAIN in the repo's Variables). Defaults to the
          # example placeholder used in docker-compose.staging.yml.
          HEALTH_URL: https://staging.precisase.example/api/health
        run: |
          echo "Waiting for app to come up..."
          sleep 10
          curl -fsS "$HEALTH_URL" | tee /tmp/health.json
          echo

  deploy-prod:
    name: Deploy to production
    # GitHub Environment approval gate — configure under repo Settings →
    # Environments → production → Required reviewers. No approval = no deploy.
    environment: production
    runs-on: ubuntu-latest
    # Cap higher than staging (30 min) because the approval-gate wait
    # counts toward this timer — a reviewer who takes 10 min to approve
    # + a 15-min deploy should still fit. A genuinely wedged deploy
    # still surfaces as failure rather than burning the 360m default.
    timeout-minutes: 30
    # Prod deploys never cancel each other mid-flight — queue them.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    # Only run on workflow_dispatch — never on plain push.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolve SHA
        id: sha
        run: |
          echo "sha=${{ inputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.sha }}
            ${{ env.IMAGE_NAME }}:prod
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/precisase
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d web worker
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web pnpm exec prisma migrate deploy

      - name: Health check
        env:
          # Operator: replace with the real prod hostname (or set APP_DOMAIN
          # in repo Variables).
          HEALTH_URL: https://precisase.example/api/health
        run: |
          echo "Waiting for app to come up..."
          sleep 10
          curl -fsS "$HEALTH_URL" | tee /tmp/health.json
          echo
