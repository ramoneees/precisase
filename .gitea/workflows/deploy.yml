name: Deploy

# Gitea Actions deploy — staging on olympus (192.168.50.11) via SSH.
# The image is built ON the docker host (compose build), so nothing leaves
# the box — no registry round-trip. The web container's entrypoint runs
# `prisma migrate deploy` on boot (see docker-compose.staging.yml).
#
# Repo secrets required:
#   DEPLOY_SSH_KEY  — ed25519 private key (gitea-precisase-deploy)
#   DEPLOY_HOST     — 192.168.50.11
#   DEPLOY_USER     — hermes

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging (olympus .11)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" 'set -euo pipefail
            cd /opt/precisase
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.lan.yml build web
            docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.lan.yml up -d web db
            # migrations: run via exec (container entrypoint does NOT migrate)
            for i in $(seq 1 12); do
              if docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.lan.yml exec -T web node_modules/.bin/prisma migrate deploy; then break; fi
              echo "migrate not ready yet (attempt $i)"; sleep 5
            done
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:3005/api/health > /dev/null; then echo "staging healthy (attempt $i)"; exit 0; fi
              echo "health not ready (attempt $i)"; sleep 10
            done
            echo "health check failed after retries"; exit 1'

      - name: Report
        if: always()
        run: echo "Deploy attempt finished at $(date -u +%FT%TZ)"
